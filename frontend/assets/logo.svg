<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="CareSaathi Logo">
  <!-- Symbol: Shielding Heart & Care Cross -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="16" fill="#0F172A" />
    <!-- Gradient Background Accent -->
    <circle cx="28" cy="28" r="22" fill="url(#tealGradient)" opacity="0.15" />
    
    <!-- Heart + Cross Emblem -->
    <path d="M28 42C28 42 16 33.5 16 24.5C16 20.358 19.358 17 23.5 17C25.5 17 27.2 18 28 19.2C28.8 18 30.5 17 32.5 17C36.642 17 40 20.358 40 24.5C40 33.5 28 42 28 42Z" 
          fill="#14B8A6" />
    <!-- White Plus/Care Symbol inside Heart -->
    <path d="M28 22V32M23 27H33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: CareSaathi -->
  <text x="72" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    Care<tspan fill="#0D9488">Saathi</tspan>
  </text>
  <text x="72" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="0.8">
    FAMILY HEALTH &amp; CARE
  </text>

  <defs>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
</svg>
